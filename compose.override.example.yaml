# Build from local clones next to this repo instead of GitHub.
services:
  registry:
    build:
      context: ../2dfs-registry
  node:
    build:
      additional_contexts:
        snapshotter: ../stargz-snapshotter
        builder: ../2dfs-builder
    # Live-edit the controller, dashboard and scenarios: restart the node to reload.
    volumes:
      - ./controller:/opt/demo/controller
      - ./dashboard:/opt/demo/dashboard
      - ./scenarios:/opt/demo/scenarios
      - ./lane:/opt/demo/lane
