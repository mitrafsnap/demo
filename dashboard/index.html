<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MitraFSnap Live Demo</title>
  <script>
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- hatch fills of the methods, as in the paper's figures -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <pattern id="hatch-docker" width="10" height="10" patternUnits="userSpaceOnUse">
        <rect width="10" height="10" fill="var(--docker)"/><g class="hatch"><path d="M-2.5,2.5l5,-5M0,10l10,-10M7.5,12.5l5,-5"/></g>
      </pattern>
      <pattern id="hatch-estargz" width="12" height="12" patternUnits="userSpaceOnUse">
        <rect width="12" height="12" fill="var(--estargz)"/><g class="hatch"><polygon points="6.00,2.60 6.85,4.83 9.23,4.95 7.38,6.45 8.00,8.75 6.00,7.45 4.00,8.75 4.62,6.45 2.77,4.95 5.15,4.83"/></g>
      </pattern>
      <pattern id="hatch-twodfs" width="10" height="10" patternUnits="userSpaceOnUse">
        <rect width="10" height="10" fill="var(--twodfs)"/><g class="hatch"><path d="M-2.5,2.5l5,-5M0,10l10,-10M7.5,12.5l5,-5M-2.5,7.5l5,5M0,0l10,10M7.5,-2.5l5,5"/></g>
      </pattern>
      <pattern id="hatch-mitrafsnap" width="10" height="10" patternUnits="userSpaceOnUse">
        <rect width="10" height="10" fill="var(--mitrafsnap)"/><g class="hatch"><circle cx="5" cy="5" r="1.9"/></g>
      </pattern>
    </defs>
  </svg>
  <header class="top">
    <div class="brand">
      <span class="logo">MitraFSnap</span>
      <span class="sub">live demo</span>
    </div>
    <div class="conn machines">
      <span class="label">Machines</span>
      <label>Registry <input id="registry" spellcheck="false" placeholder="this machine"
        title="host:port of the registry, empty for the registry of the backend"></label>
      <label>Builder <input id="builder" spellcheck="false" placeholder="this machine"
        title="URL of the demo backend that builds the images, empty for the backend itself"></label>
      <label class="token">token <input id="builder-token" type="password" placeholder="none"></label>
      <label>Backend <input id="backend" spellcheck="false" placeholder="this machine"
        title="URL of the demo backend that runs the lanes, empty for the machine that serves this page"></label>
      <label class="token">token <input id="token" type="password" placeholder="none"></label>
      <button id="apply-machines">Apply</button>
      <span id="status" class="pill">offline</span>
    </div>
    <button id="theme" class="ghost theme" type="button" aria-label="Switch to light mode" title="Switch to light mode">
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
    </button>
  </header>

  <section class="controls">
    <div class="group scenario">
      <span class="label">Scenario</span>
      <select id="scenario"></select>
      <button id="webcam" hidden>Use my webcam</button>
    </div>
    <div class="group">
      <span class="label">Methods</span>
      <div id="lane-toggles" class="toggles"></div>
      <button id="all-lanes" class="ghost">Show all</button>
    </div>
    <div class="group">
      <span class="label">Edge link</span>
      <select id="link">
        <option value="50">50 Mbit/s</option>
        <option value="100">100 Mbit/s</option>
        <option value="200">200 Mbit/s</option>
        <option value="500">500 Mbit/s</option>
        <option value="1000">1 Gbit/s</option>
        <option value="0">unlimited</option>
      </select>
      <span class="label">Device</span>
      <select id="device" title="auto uses a GPU when the backend has one">
        <option value="auto">auto</option>
        <option value="apple">Apple GPU</option>
        <option value="cuda">NVIDIA GPU</option>
        <option value="cpu">CPU</option>
      </select>
      <span class="pill mode" title="All shown methods run at the same time on one machine and share its CPU and link.">live mode</span>
    </div>
  </section>

  <p id="scenario-desc" class="desc"></p>

  <section class="stage">
    <nav class="acts" id="acts" aria-label="Acts"></nav>
    <div class="workflow">
      <svg id="diagram" viewBox="0 0 1300 262" preserveAspectRatio="xMidYMid meet" role="img"
           aria-label="Workflow from build to serving, with replace and refresh update paths"></svg>
    </div>
  </section>
  <p class="narration" id="narration" aria-live="polite"></p>

  <main id="lanes" class="lanes"></main>

  <section class="compare" aria-label="Comparison charts">
    <div class="compare-head">
      <h2>Compared live</h2>
      <div id="chart-legend" class="legend"></div>
      <button id="chart-mode" class="ghost">Show as tables</button>
    </div>
    <div id="charts" class="charts"></div>
  </section>
  <div id="tip" class="tip" hidden></div>

  <section class="bottom">
    <details id="log-box">
      <summary>Event log</summary>
      <ol id="log"></ol>
    </details>
    <p id="credits" class="credits"></p>
  </section>

  <script src="app.js"></script>
</body>
</html>
