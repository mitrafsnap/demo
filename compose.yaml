# MitraFSnap demo backend.
#
#   docker compose up -d --build
#
# Sources default to the public mitrafsnap repos. To build from local clones,
# copy compose.override.example.yaml to compose.override.yaml.

name: mitrafsnap-demo

services:
  registry:
    build:
      context: https://github.com/mitrafsnap/2dfs-registry.git#main
    environment:
      OTEL_TRACES_EXPORTER: none
    volumes:
      - registry-data:/var/lib/registry
    ports:
      - "127.0.0.1:5000:5000"

  node:
    build:
      context: node
      additional_contexts:
        demo: .
        snapshotter: https://github.com/mitrafsnap/stargz-snapshotter.git#demo
        builder: https://github.com/mitrafsnap/2dfs-builder.git#main
    privileged: true
    cgroup: host
    devices:
      - /dev/fuse
    depends_on:
      - registry
    environment:
      DEMO_TOKEN: ${DEMO_TOKEN:-}
    ports:
      # Set DEMO_BIND=0.0.0.0 (and DEMO_TOKEN) to reach the backend from other machines.
      - "${DEMO_BIND:-127.0.0.1}:8080:8080"
    volumes:
      - containerd:/var/lib/containerd
      - stargz:/var/lib/containerd-stargz-grpc
      - buildkit:/var/lib/buildkit
      - tdfs:/root/.2dfs
      - demo:/var/lib/demo
      - ./node:/smoke:ro

volumes:
  demo:
  registry-data:
  containerd:
  stargz:
  buildkit:
  tdfs:
