# Lanes measure lazy access, so nothing is fetched unless asked for: prefetch
# only follows the registry's stargz.prefetch annotations (partition selection).
no_background_fetch = true
disable_verification = true
metrics_address = "0.0.0.0:8234"

[[resolver.host."registry:5000".mirrors]]
  host = "registry:5000"
  insecure = true

# Lanes reach the registry through the controller's emulated link (link.py),
# one port per method.
[[resolver.host."127.0.0.1:5101".mirrors]]
  host = "127.0.0.1:5101"
  insecure = true
[[resolver.host."127.0.0.1:5102".mirrors]]
  host = "127.0.0.1:5102"
  insecure = true
[[resolver.host."127.0.0.1:5103".mirrors]]
  host = "127.0.0.1:5103"
  insecure = true
[[resolver.host."127.0.0.1:5104".mirrors]]
  host = "127.0.0.1:5104"
  insecure = true

[fuse]
  passthrough = true
